<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Month in Hatfield</title>
  <meta name="description" content="A 3D animated month in Hatfield, Pretoria: work, wine, cards, and groove.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23160d24'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23ffb347'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --glass: rgba(18, 11, 28, .66); --line: rgba(255, 255, 255, .14); --text: #fbf5ff; --dim: #c9bcd6; --amber: #ffb347; --violet: #a78bfa; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0718; color: var(--text); font-family: Inter, system-ui, sans-serif; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    #stage, #stage canvas { position: fixed; inset: 0; display: block; }
    .labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .hud { position: fixed; z-index: 5; }
    .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 20px; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); box-shadow: 0 20px 60px -24px #000; }

    .brand { top: 20px; left: 22px; font: 700 .95rem Sora, sans-serif; letter-spacing: .01em; text-shadow: 0 2px 14px rgba(0, 0, 0, .6); }
    .brand small { display: block; font: 500 .68rem Inter, sans-serif; letter-spacing: .2em; text-transform: uppercase; opacity: .8; }

    .story { left: 50%; bottom: 18px; transform: translateX(-50%); width: min(820px, calc(100vw - 24px)); padding: 16px 20px 12px; }
    .row { display: flex; gap: 20px; align-items: center; }
    .when { flex: none; text-align: center; padding-right: 20px; border-right: 1px solid var(--line); min-width: 112px; }
    .when b { display: block; font: 800 2rem/1 Sora, sans-serif; font-variant-numeric: tabular-nums; color: var(--amber); }
    .when span { display: block; margin-top: 4px; font-size: .64rem; color: var(--dim); text-transform: uppercase; letter-spacing: .16em; }
    .cal { display: grid; grid-template-columns: repeat(7, 9px); gap: 3px; justify-content: center; margin-top: 8px; }
    .cal i { width: 9px; height: 9px; border-radius: 3px; background: rgba(255, 255, 255, .16); }
    .cal i.office { background: rgba(142, 203, 255, .55); }
    .cal i.weekend { background: rgba(255, 95, 162, .5); }
    .cal i.past { opacity: .35; }
    .cal i.now { background: var(--amber); opacity: 1; box-shadow: 0 0 8px var(--amber); transform: scale(1.25); }
    .story h2 { margin: 0 0 .25rem; font: 700 1.25rem/1.15 Sora, sans-serif; letter-spacing: -.01em; }
    .story p { margin: 0; font-size: .9rem; line-height: 1.5; color: #e6dbf1; min-height: 2.7em; }
    .bar { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .dots { flex: 1; display: flex; gap: 4px; }
    .dots button { flex: 1; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, .16); overflow: hidden; padding: 0; position: relative; }
    .dots button:hover { background: rgba(255, 255, 255, .34); }
    .dots button.done { background: var(--violet); }
    .dots button i { position: absolute; inset: 0; width: 0; background: var(--amber); border-radius: 99px; }
    .ctl { width: 34px; height: 34px; border-radius: 11px; border: 1px solid var(--line); display: grid; place-items: center; font-size: .85rem; flex: none; transition: .15s; }
    .ctl:hover { background: rgba(255, 255, 255, .14); }
    .ctl.wide { width: auto; padding: 0 12px; font-size: .76rem; gap: 6px; display: flex; }
    .ctl.on { background: var(--amber); color: #1a1026; border-color: var(--amber); }

    /* labels living in the 3D world */
    .sign { font: 800 1rem Sora, sans-serif; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; color: #fff; text-shadow: 0 0 8px currentColor, 0 0 22px currentColor, 0 0 40px currentColor; }
    .plain { font: 600 .74rem Sora, sans-serif; white-space: nowrap; padding: 3px 10px; border-radius: 99px; background: rgba(15, 9, 25, .78); border: 1px solid var(--line); }
    .say { font: 600 .8rem Sora, sans-serif; white-space: nowrap; padding: 5px 11px; border-radius: 14px 14px 14px 4px; background: #fff; color: #1a1026; box-shadow: 0 6px 20px -6px #000; transform: translate(40%, -30%); }
    .fx { font-size: 1.25rem; text-shadow: 0 2px 10px rgba(0, 0, 0, .6); }
    .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 2rem; text-align: center; color: var(--dim); }

    @media (max-width: 720px) {
      .brand { left: 14px; top: 14px; }
      .story { bottom: 10px; padding: 12px 14px 10px; }
      .row { gap: 12px; align-items: flex-start; }
      .when { min-width: 78px; padding-right: 12px; }
      .when b { font-size: 1.35rem; }
      .story h2 { font-size: 1.05rem; }
      .story p { font-size: .82rem; min-height: 5.6em; }
      .ctl.wide span { display: none; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="stage"></div>

  <header class="hud brand">A Month in Hatfield<small>Pretoria</small></header>

  <section class="hud glass story">
    <div class="row">
      <div class="when"><b id="clock">09:00</b><span id="day"></span><div class="cal" id="cal"></div></div>
      <div>
        <h2 id="title"></h2>
        <p id="text"></p>
      </div>
    </div>
    <div class="bar">
      <button class="ctl" id="prev" aria-label="Previous scene">⏮</button>
      <button class="ctl" id="play" aria-label="Pause or play">⏸</button>
      <button class="ctl" id="next" aria-label="Next scene">⏭</button>
      <div class="dots" id="dots"></div>
      <button class="ctl wide" id="sound" aria-label="Toggle music">♪ <span>Groove</span></button>
    </div>
  </section>

  <script type="module" src="/main.js"></script>
</body>
</html>
