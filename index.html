<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Week in Hatfield — my life, animated</title>
  <meta name="description" content="A 3D animated week in Hatfield, Pretoria: work, wine, cards, and groove.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23160d24'/%3E%3Ccircle cx='32' cy='32' r='13' fill='%23ffb347'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { --glass: rgba(20, 12, 32, .7); --line: rgba(255, 255, 255, .14); --text: #fbf5ff; --dim: #c2b3d1; --amber: #ffb347; --pink: #ff5fa2; --violet: #a78bfa; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0718; color: var(--text); font-family: Inter, system-ui, sans-serif; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    #stage, #stage canvas { position: fixed; inset: 0; display: block; }
    .labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .hud { position: fixed; z-index: 5; }
    .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 20px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 20px 60px -24px #000; }

    .top { top: 18px; left: 18px; padding: 14px 20px; display: flex; align-items: center; gap: 18px; }
    .top h1 { margin: 0; font: 700 1.05rem Sora, sans-serif; letter-spacing: -.01em; }
    .top h1 small { display: block; font: 500 .7rem Inter, sans-serif; color: var(--dim); letter-spacing: .02em; }
    .when { text-align: right; border-left: 1px solid var(--line); padding-left: 18px; }
    .when b { display: block; font: 800 1.7rem/1 Sora, sans-serif; font-variant-numeric: tabular-nums; color: var(--amber); }
    .when span { font-size: .72rem; color: var(--dim); text-transform: uppercase; letter-spacing: .14em; }

    .bday { top: 18px; right: 18px; padding: 10px 16px; font-size: .78rem; color: var(--dim); text-align: right; }
    .bday b { display: block; font: 700 1.05rem Sora, sans-serif; color: var(--pink); }

    .story { left: 50%; bottom: 18px; transform: translateX(-50%); width: min(760px, calc(100vw - 24px)); padding: 18px 22px 14px; }
    .story .kicker { margin: 0; font: 600 .68rem Sora, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: var(--amber); }
    .story h2 { margin: .25rem 0 .4rem; font: 700 1.45rem/1.15 Sora, sans-serif; letter-spacing: -.02em; }
    .story p { margin: 0; font-size: .95rem; line-height: 1.55; color: #e9def5; min-height: 4.6em; }
    .bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .dots { flex: 1; display: flex; gap: 4px; }
    .dots button { flex: 1; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .16); overflow: hidden; padding: 0; position: relative; }
    .dots button:hover { background: rgba(255, 255, 255, .34); }
    .dots button.done { background: var(--violet); }
    .dots button i { position: absolute; inset: 0; width: 0; background: var(--amber); border-radius: 99px; }
    .ctl { width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-items: center; font-size: .95rem; flex: none; transition: .15s; }
    .ctl:hover { background: rgba(255, 255, 255, .14); }
    .ctl.wide { width: auto; padding: 0 12px; font-size: .78rem; gap: 6px; display: flex; }
    .ctl.on { background: var(--amber); color: #1a1026; border-color: var(--amber); }

    /* labels living in the 3D world */
    .sign { font: 800 1rem Sora, sans-serif; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; color: #fff; text-shadow: 0 0 8px currentColor, 0 0 22px currentColor, 0 0 40px currentColor; }
    .plain { font: 600 .72rem Sora, sans-serif; white-space: nowrap; padding: 3px 9px; border-radius: 99px; background: rgba(15, 9, 25, .78); border: 1px solid var(--line); }
    .say { font: 600 .82rem Sora, sans-serif; white-space: nowrap; padding: 5px 11px; border-radius: 14px 14px 14px 4px; background: #fff; color: #1a1026; box-shadow: 0 6px 20px -6px #000; transform: translate(40%, -30%); }
    .who { font: 700 .62rem Sora, sans-serif; letter-spacing: .12em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--amber); color: #1a1026; white-space: nowrap; }
    .who.her { background: var(--pink); color: #fff; }
    .fx { font-size: 1.25rem; text-shadow: 0 2px 10px rgba(0, 0, 0, .6); }
    .fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 2rem; text-align: center; color: var(--dim); }

    @media (max-width: 720px) {
      .top { left: 10px; top: 10px; padding: 10px 14px; gap: 12px; }
      .top h1 { font-size: .9rem; }
      .when b { font-size: 1.3rem; }
      .bday { display: none; }
      .story { bottom: 10px; padding: 14px 16px 12px; }
      .story h2 { font-size: 1.15rem; }
      .story p { font-size: .86rem; min-height: 6.2em; }
      .ctl.wide span { display: none; }
    }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="stage"></div>

  <header class="hud glass top">
    <h1>A Week in Hatfield<small>Pretoria · my life, animated</small></h1>
    <div class="when"><b id="clock">09:00</b><span id="day">Monday</span></div>
  </header>

  <div class="hud glass bday">Turning 27 on 21 December<b id="count"></b></div>

  <section class="hud glass story">
    <p class="kicker" id="kicker"></p>
    <h2 id="title"></h2>
    <p id="text"></p>
    <div class="bar">
      <button class="ctl" id="prev" aria-label="Previous scene">⏮</button>
      <button class="ctl" id="play" aria-label="Pause or play">⏸</button>
      <button class="ctl" id="next" aria-label="Next scene">⏭</button>
      <div class="dots" id="dots"></div>
      <button class="ctl wide" id="sound" aria-label="Toggle music">♪ <span>Groove</span></button>
    </div>
  </section>

  <script type="module" src="/main.js"></script>
</body>
</html>
